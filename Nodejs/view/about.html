<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me | Numan Fadil Kedir</title>
    <style>
        /* Modern Clean Setup */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #334155;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .about-card {
            background: white;
            max-width: 650px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        h1 {
            color: #1e293b;
            margin-top: 0;
            font-size: 2rem;
            border-left: 5px solid #4f46e5;
            padding-left: 15px;
        }

        .tagline {
            font-weight: 600;
            color: #4f46e5;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: block;
        }

        p {
            margin-bottom: 20px;
        }

        .highlights {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .footer-link {
            margin-top: 30px;
            display: inline-block;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: #4f46e5;
        }
    </style>
</head>
<body>

    <div class="about-card">
        <span class="tagline">Information Systems & Product Management</span>
        <h1>Numan Fadil Kedir</h1>
